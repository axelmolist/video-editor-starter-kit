<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/>
<!-- Worked ANIMATED example for HTML/CSS (HyperFrames) animation. Renders to MP4 (or MOV/WebM for alpha).
     One continuous motion that climaxes, ~2-4s. Same paused-GSAP-timeline convention the
     video pipeline uses: register a paused timeline on window.__timelines["main"]; every
     timed element has class="clip" + a unique data-track-index. Tokens from design-system.css. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../brand.css"/>
<link rel="stylesheet" href="../../design-system.css"/>
<!-- REQUIRED: brand fonts inlined as data: URIs. Without this, HyperFrames grabs the
     first frame before the webfonts load and bakes the fallback sans in. Must come last.
     Regenerate with: python3 design-studio/build_embedded_fonts.py -->
<link rel="stylesheet" href="../../fonts-embedded.css"/>
<style>
  html,body{ width:1080px; height:1920px; overflow:hidden; font-family:var(--font-body) }
  #root{ position:relative; width:1080px; height:1920px }
  .kicker{ position:absolute; width:100%; text-align:center; top:760px }
  .big{ position:absolute; width:100%; text-align:center; top:840px; font-family:var(--font-title);
        font-size:300px; color:var(--text); line-height:1 }
  .label{ position:absolute; width:100%; text-align:center; top:1200px; color:var(--muted);
          font-weight:700; letter-spacing:6px; text-transform:uppercase; font-size:40px }
  .dot{ position:absolute; left:523px; top:1380px }
</style>
</head>
<body>
  <!-- For MP4 the backdrop CAN sit on body, but keeping it in-DOM also lets you export the
       same composition as a transparent MOV/WebM (--format mov) by removing .ds-bg. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="3.0" data-width="1080" data-height="1920">
    <div class="ds-bg"></div>
    <div class="kicker ds-kicker clip" data-start="0" data-duration="3.0" data-track-index="1">A SYSTEM, NOT A ONE-OFF</div>
    <div class="big clip" data-start="0" data-duration="3.0" data-track-index="2" id="cnt">12</div>
    <div class="label clip" data-start="0" data-duration="3.0" data-track-index="3">formats from one source</div>
    <div class="dot ds-dot clip" data-start="0" data-duration="3.0" data-track-index="4"></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from(".kicker", { opacity:0, y:-16, duration:.35 }, 0);
    // The big figure is STATIC text that scales/fades in. Transform + opacity tweens (.from)
    // render correctly on HyperFrames' seek-based capture. For an ANIMATED count-UP, do NOT use
    // onUpdate/modifiers to mutate DOM text (HyperFrames forbids onUpdate and captures frames by
    // seeking, so callback counters freeze) - follow HyperFrames' own counter pattern in its
    // SKILL docs (references/*.md) and verify the climax frame before relying on it.
    tl.from("#cnt", { opacity:0, scale:.7, duration:.5, ease:"back.out(2)" }, .2);
    tl.from(".label", { opacity:0, y:16, duration:.4 }, .9);
    tl.from(".dot",   { opacity:0, scale:0, duration:.4, ease:"back.out(2)" }, 1.3);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
